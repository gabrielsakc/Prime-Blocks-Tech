<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher | Prime Blocks Tech</title>
    <style>
        body {
            background-color: #0a0b1e;
            color: #e0e0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(20, 22, 45, 0.7);
            padding: 3rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(37, 209, 244, 0.2);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #25d1f4 0%, #1a8aef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p {
            color: #a0a0c0;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #25d1f4 0%, #1a8aef 100%);
            color: white;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(37, 209, 244, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 209, 244, 0.5);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #505070;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Prime Blocks Tech</h1>
        <p>EPS Cost Calculator Suite</p>
        <button onclick="window.location.href='index.html'" class="btn">Launch Application</button>
        <div class="footer">
            Precision Manufacturing estimation tool
        </div>
    </div>
</body>

</html>
